name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -r requirements-dev.txt
      - name: Unit tests (PySpark)
        run: pytest -q tests
      - name: Validate bundle YAML
        run: python -c "import yaml; [yaml.safe_load(open(f)) for f in ['databricks.yml', 'resources/psx_job.yml']]"

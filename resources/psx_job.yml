resources:
  jobs:
    psx_lakehouse_daily:
      name: psx-lakehouse-daily
      description: PSX end-of-day prices -> bronze -> silver -> gold, with data-quality checks.
      schedule:
        quartz_cron_expression: "0 0 19 ? * MON-FRI"   # 7pm Karachi, after the source refresh at 6pm
        timezone_id: Asia/Karachi
        pause_status: UNPAUSED
      max_concurrent_runs: 1
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}
      tasks:
        - task_key: setup
          notebook_task: {notebook_path: ../notebooks/00_setup.py}
        - task_key: ingest
          depends_on: [{task_key: setup}]
          notebook_task: {notebook_path: ../notebooks/01_ingest.py}
          max_retries: 2
          min_retry_interval_millis: 300000
        - task_key: bronze
          depends_on: [{task_key: ingest}]
          notebook_task: {notebook_path: ../notebooks/02_bronze.py}
        - task_key: silver
          depends_on: [{task_key: bronze}]
          notebook_task: {notebook_path: ../notebooks/03_silver.py}
        - task_key: gold
          depends_on: [{task_key: silver}]
          notebook_task: {notebook_path: ../notebooks/04_gold.py}
        - task_key: quality_checks
          depends_on: [{task_key: gold}]
          notebook_task: {notebook_path: ../notebooks/05_quality_checks.py}
